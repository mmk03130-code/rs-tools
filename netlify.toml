[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# WWW and HTTP redirects to canonical non-WWW HTTPS
[[redirects]]
  from = "https://www.rsutilitytools.netlify.app/*"
  to = "https://rsutilitytools.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.rsutilitytools.netlify.app/*"
  to = "https://rsutilitytools.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://rsutilitytools.netlify.app/*"
  to = "https://rsutilitytools.netlify.app/:splat"
  status = 301
  force = true

# Static assets & routes
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Return genuine HTTP 404 for unknown routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
