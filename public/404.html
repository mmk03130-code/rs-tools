<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found – RS tools</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 480px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #60a5fa;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      h1 { font-size: 48px; font-weight: 800; color: #3b82f6; margin-bottom: 8px; }
      h2 { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; }
      p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 28px; }
      a {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        transition: background 0.2s ease;
      }
      a:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 Error</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The requested utility or document path does not exist on this server. All RS Tools utilities are hosted on our interactive dashboard.</p>
      <a href="https://rsutilitytools.netlify.app/">Return to RS Tools Dashboard</a>
    </div>
  </body>
</html>
