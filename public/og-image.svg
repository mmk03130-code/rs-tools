<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base with Ambient Mesh -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#mesh1)"/>
  <rect width="1200" height="630" fill="url(#mesh2)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Logo Emblem -->
  <g transform="translate(100, 70)">
    <rect width="84" height="84" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <!-- R -->
    <path d="M 24 24 L 24 60" stroke="url(#glowR)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 24 24 H 38 C 45 24 49 28 49 34 C 49 40 45 44 38 44 H 24" stroke="url(#glowR)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36 44 L 49 60" stroke="url(#glowR)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- S -->
    <path d="M 66 30 C 63 25 58 24 54 24 C 47 24 43 28 43 34 C 43 41 63 40 63 50 C 63 57 58 60 51 60 C 45 60 41 55 40 52" stroke="url(#glowS)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Node -->
    <circle cx="67" cy="22" r="4" fill="#38bdf8"/>
    <!-- Wordmark -->
    <text x="108" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">RS<tspan fill="#38bdf8">TOOLS</tspan></text>
    <text x="110" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="3">CLIENT-SIDE PRIVACY SUITE</text>
  </g>

  <!-- Headline & Subheadline -->
  <text x="100" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Free, Private Web Tools That</text>
  <text x="100" y="328" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="900" fill="#38bdf8" letter-spacing="-1.5">Never Touch a Server</text>
  <text x="100" y="388" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">52 High-Performance Utilities · WebAssembly · Zero Cloud Uploads · Free Forever</text>

  <!-- Workstations Grid -->
  <g transform="translate(100, 440)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="225" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">Image Studio</text>
    <text x="24" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">15 Local Tools</text>

    <!-- Box 2 -->
    <rect x="250" y="0" width="225" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="274" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#f43f5e">PDF & Docs</text>
    <text x="274" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">16 Vector Tools</text>

    <!-- Box 3 -->
    <rect x="500" y="0" width="235" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="524" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#a855f7">Resume Studio</text>
    <text x="524" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">150+ ATS Templates</text>

    <!-- Box 4 -->
    <rect x="760" y="0" width="235" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="784" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#34d399">Developer Hub</text>
    <text x="784" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">17 Code & Crypto Tools</text>
  </g>

  <!-- URL footer -->
  <text x="100" y="570" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#64748b">https://rsutilitytools.com</text>
</svg>
